# موقع Netlify جديد ومستقل عن الموقع الحالي، حتى يُختبر على رابط Preview قبل نقل الدومين.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# إضافة Next.js الرسمية من Netlify (تُثبّت تلقائياً عادةً، وذُكرت هنا للوضوح)
[[plugins]]
  package = "@netlify/plugin-nextjs"
